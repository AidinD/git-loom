appId: io.aidin.loom
productName: Loom
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
win:
  target: nsis
  # The generated multi-size .ico, not a PNG: electron-builder would
  # downscale one 512px bitmap to 16px, which is what the small drawing in
  # scripts/generate-icon.mjs exists to avoid.
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
publish:
  provider: github
  owner: AidinD
  repo: git-loom
  # Without this electron-builder defaults to a DRAFT release, which
  # electron-updater never sees - so the app silently stops updating. It also
  # raced with itself and created the draft twice, splitting the assets across
  # them. Jot and Nib both set this; Loom was the one that did not.
  releaseType: release
