appId: io.aidin.loom
productName: Loom
directories:
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
win:
  target: nsis
  # The generated multi-size .ico, not a PNG: electron-builder would
  # downscale one 512px bitmap to 16px, which is what the small drawing in
  # scripts/generate-icon.mjs exists to avoid.
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-setup.${ext}
publish:
  provider: github
  owner: AidinD
  repo: git-loom
  # This block's real job is telling electron-updater where the installed app
  # should look for updates; the release itself is published by CI with
  # `gh release create`, not by electron-builder (see scripts/release.mjs).
  #
  # releaseType is here only as a guard: if anyone ever does run
  # `electron-builder --publish always` by hand, it stops them producing a DRAFT
  # release, which electron-updater cannot see at all.
  releaseType: release
